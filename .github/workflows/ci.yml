name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    name: syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static checks
        run: tests/check_syntax.sh

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHOTS_DIR: ${{ runner.temp }}/shots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install Playwright
        run: |
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: E2E servers
        run: python tests/e2e_servers.py
      - name: E2E profiles
        if: ${{ !cancelled() }}
        run: python tests/e2e_profiles.py
      - name: E2E two devices on one profile
        if: ${{ !cancelled() }}
        run: python tests/e2e_merge.py
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
