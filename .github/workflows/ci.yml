name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    name: syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static checks
        run: tests/check_syntax.sh
      - name: Merge rules (unit)
        run: node tests/unit_sync.mjs
      - name: Connector contracts (unit)
        run: node tests/unit_contracts.mjs
      - name: Task model (unit)
        run: node tests/unit_tasks.mjs
      - name: Search the sources and add a series (unit)
        run: node tests/unit_collect.mjs
      - name: Shared task history (unit)
        run: node tests/unit_tasks_shared.mjs
      - name: Automatic retry policy (unit)
        run: node tests/unit_tasks_retry.mjs
      - name: Facade (unit)
        run: node tests/unit_facade.mjs
      - name: Profiles (unit)
        run: node tests/unit_profiles.mjs
      - name: Main profile name in English (unit)
        run: node tests/unit_profile_name.mjs
      - name: Subscriptions (unit)
        run: node tests/unit_store.mjs
      - name: Service worker push handlers (unit)
        run: node tests/unit_sw_push.mjs
      - name: Security headers (nginx)
        run: |
          command -v nginx >/dev/null || sudo apt-get install -y --no-install-recommends nginx-light
          python3 tests/nginx_headers.py

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHOTS_DIR: /tmp/scrollarr-shots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install Playwright
        run: |
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Folders dependencies (locked; the folders e2e suites start the real service)
        run: npm ci --omit=dev --no-audit --no-fund
        working-directory: folders
      - name: Notifier dependencies (locked; the push e2e suite starts the real service)
        run: npm ci --omit=dev --no-audit --no-fund
        working-directory: notifier
      - name: E2E servers
        run: python tests/e2e_servers.py
      - name: E2E profiles
        if: ${{ !cancelled() }}
        run: python tests/e2e_profiles.py
      - name: E2E two devices on one profile
        if: ${{ !cancelled() }}
        run: python tests/e2e_merge.py
      - name: E2E multi-device sync (ties, clocks, slow writes, subscriptions)
        if: ${{ !cancelled() }}
        run: python tests/e2e_sync.py
      - name: E2E collector tasks
        if: ${{ !cancelled() }}
        run: python tests/e2e_tasks.py
      - name: E2E search the sources and add a series
        if: ${{ !cancelled() }}
        run: python tests/e2e_search.py
      - name: E2E shared task history (two devices)
        if: ${{ !cancelled() }}
        run: python tests/e2e_tasks_shared.py
      - name: E2E automatic retry of failed downloads
        if: ${{ !cancelled() }}
        run: python tests/e2e_tasks_retry.py
      - name: E2E push notifications (real notifier, stubbed push registration, service worker)
        if: ${{ !cancelled() }}
        run: python tests/e2e_push.py
      - name: E2E reader without progress
        if: ${{ !cancelled() }}
        run: python tests/e2e_progress.py
      - name: E2E unreachable server
        if: ${{ !cancelled() }}
        run: python tests/e2e_offline.py
      - name: E2E folders reader (real service, none and password modes, offline, next to Suwayomi)
        if: ${{ !cancelled() }}
        run: python tests/e2e_folders.py
      - name: E2E folders progress (real service, resume, restart, network cut, folders-only UI)
        if: ${{ !cancelled() }}
        run: python tests/e2e_folders_progress.py
      - name: E2E folders profiles (real service next to Suwayomi, two devices, deletion)
        if: ${{ !cancelled() }}
        run: python tests/e2e_folders_profiles.py
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: /tmp/scrollarr-shots
          if-no-files-found: ignore

  folders:
    name: folders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Folders dependencies (locked)
        run: npm ci --omit=dev --no-audit --no-fund
        working-directory: folders
      - name: Folders naming (unit)
        run: node tests/unit_folders_naming.mjs
      - name: Folders ids and confinement (unit)
        run: node tests/unit_folders_ids.mjs
        if: ${{ !cancelled() }}
      - name: Folders configuration (unit)
        run: node tests/unit_folders_config.mjs
        if: ${{ !cancelled() }}
      - name: Folders authentication and cross-origin guards (unit)
        run: node tests/unit_folders_auth.mjs
        if: ${{ !cancelled() }}
      - name: Folders library index (unit)
        run: node tests/unit_folders_library.mjs
        if: ${{ !cancelled() }}
      - name: Folders structure over HTTP (integration)
        run: node tests/integration_folders.mjs
        if: ${{ !cancelled() }}
      - name: Folders archives and image types (unit)
        run: node tests/unit_folders_archive.mjs
        if: ${{ !cancelled() }}
      - name: Folders pages and covers over HTTP (integration)
        run: node tests/integration_folders_pages.mjs
        if: ${{ !cancelled() }}
      - name: Folders invalidation (integration)
        run: node tests/integration_folders_invalidation.mjs
        if: ${{ !cancelled() }}
      - name: Folders progress (store)
        run: node tests/unit_folders_progress.mjs
        if: ${{ !cancelled() }}
      - name: Folders progress (integration)
        run: node tests/integration_folders_progress.mjs
        if: ${{ !cancelled() }}
      - name: Folders reader in the app (unit)
        run: node tests/unit_folders_reader.mjs
        if: ${{ !cancelled() }}
      - name: Notifier dependencies (locked)
        run: npm ci --omit=dev --no-audit --no-fund
        working-directory: notifier
        if: ${{ !cancelled() }}
      - name: Notifier service over HTTP (integration)
        run: node tests/integration_notifier.mjs
        if: ${{ !cancelled() }}
      - name: Notifier detection of new chapters (integration)
        run: node tests/integration_notifier_detect.mjs
        if: ${{ !cancelled() }}
      - name: Notifier real sending to a local push service (integration)
        run: node tests/integration_notifier_push.mjs
        if: ${{ !cancelled() }}
      - name: Folders container (read-only mounts, health)
        run: tests/container_folders.sh
        if: ${{ !cancelled() }}
      - name: Images built from sources with restrictive file modes
        run: tests/container_perms.sh
        if: ${{ !cancelled() }}
      - name: Hardening - main container starts and serves the page
        run: tests/container_hardening.sh main
        if: ${{ !cancelled() }}
      - name: Hardening - main container proxies a request
        run: tests/container_hardening.sh proxy
        if: ${{ !cancelled() }}
      - name: Hardening - notifier starts, answers health and VAPID, writes its data volume
        run: tests/container_hardening.sh notifier
        if: ${{ !cancelled() }}
